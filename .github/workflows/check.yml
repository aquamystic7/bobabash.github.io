name: check
on: pull_request
permissions:
  contents: read
jobs:
  own-folder-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR only touches one card folder under sites/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          [ -n "$files" ] || { echo "No changes."; exit 0; }
          bad=$(echo "$files" | grep -Ev '^sites/[0-9]+/' || true)
          if [ -n "$bad" ]; then echo "::error::Only edit your own folder, sites/<your card number>/. These files are outside it:"; echo "$bad"; exit 1; fi
          folders=$(echo "$files" | cut -d/ -f2 | sort -u)
          if [ "$(echo "$folders" | wc -l)" -ne 1 ]; then echo "::error::One card folder per PR. This one touches: $(echo $folders)"; exit 1; fi
          while IFS= read -r f; do
            [ -e "$f" ] || continue
            if [ -L "$f" ]; then echo "::error::No symlinks: $f"; exit 1; fi
            size=$(stat -c %s "$f")
            if [ "$size" -gt 5242880 ]; then echo "::error::$f is over 5 MB"; exit 1; fi
          done <<< "$files"
          echo "Card $folders looks good."
